<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目案例 · 网站 / 小程序 / 后台系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #fff;
    color: #171717;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 24px; }

  nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.9);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid #ebebeb;
  }
  .nav-in {
    max-width: 820px; margin: 0 auto; padding: 13px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-size: 14px; font-weight: 600; }
  .brand i { font-style: normal; color: #a3a3a3; font-weight: 400; margin-left: 10px; font-size: 12.5px; }

  .lang-switch { display: inline-flex; border: 1px solid #e5e5e5; border-radius: 4px; overflow: hidden; }
  .lang-switch button {
    border: 0; background: #fff; cursor: pointer;
    font-size: 12px; font-weight: 500; color: #737373;
    padding: 5px 12px; font-family: inherit; transition: background .15s, color .15s;
  }
  .lang-switch button + button { border-left: 1px solid #e5e5e5; }
  .lang-switch button.active { background: #171717; color: #fff; }

  .hero { padding: 64px 0 40px; }
  .hero h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.6px; margin-bottom: 14px; }
  .hero p { font-size: 15px; color: #5f5f5f; max-width: 560px; line-height: 1.8; }

  .list { display: flex; flex-direction: column; gap: 44px; padding: 36px 0 12px; }

  .item { display: block; text-decoration: none; color: inherit; }
  .thumb {
    display: block; border: 1px solid #e5e5e5; border-radius: 5px;
    overflow: hidden; background: #fafafa; line-height: 0;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .thumb img {
    width: 100%; height: 250px; object-fit: cover; object-position: top center;
    display: block; transition: opacity .2s ease;
  }
  .item:hover .thumb { border-color: #c9c9c9; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .thumb.phone img { object-fit: contain; background: #f4f4f2; }
  .item:hover .thumb img { opacity: .94; }

  .meta { font-size: 12.5px; color: #8c8c8c; margin: 16px 0 6px; }
  .item h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 7px; }
  .item .desc { font-size: 14px; color: #5f5f5f; line-height: 1.75; margin-bottom: 13px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px; color: #525252; background: #f6f6f6;
    border: 1px solid #eeeeee; border-radius: 3px; padding: 2px 7px;
  }
  .view { font-size: 13px; color: #171717; font-weight: 500; white-space: nowrap; }
  .item:hover .view { text-decoration: underline; text-underline-offset: 3px; }

  footer { border-top: 1px solid #ebebeb; padding: 32px 0 72px; font-size: 14px; color: #5f5f5f; margin-top: 48px; }
  footer strong { color: #171717; font-weight: 600; }
  .mail {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    color: #171717; text-decoration: underline; text-underline-offset: 3px;
    text-decoration-color: #d4d4d4;
  }
  .mail:hover { text-decoration-color: #171717; }

  @media (max-width: 700px) {
    .hero { padding: 44px 0 28px; }
    .hero h1 { font-size: 25px; }
    .hero p { font-size: 14px; }
    .thumb img { height: 175px; }
    .list { gap: 34px; }
    .item h3 { font-size: 17.5px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <div class="brand"><span data-i18n="brand">项目案例</span><i data-i18n="brandsub">网站 / 小程序 / 后台</i></div>
    <div class="lang-switch">
      <button type="button" data-lang="zh" class="active">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="h1">可交付的项目骨架</h1>
    <p data-i18n="lead">每个案例都可以直接点开操作，不是效果图。源码完整交付，交付范围和工期写在每一栏下面。</p>
  </section>

  <section class="list" id="list"></section>

  <footer>
    <p style="margin-bottom:8px">
      <strong data-i18n="fstrong">需要类似的项目？</strong><span data-i18n="ftext"> 把功能清单发我，按模块拆解工期和报价。</span>
    </p>
    <p><span data-i18n="fmail">邮箱：</span><a class="mail" id="mail" href="#"></a></p>
  </footer>
</main>

<script>
(function () {
  var P = [
    {
      img: 'covers/agency.jpg',
      cat:   { zh: '企业官网 · 品牌展示', en: 'Corporate site · Brand' },
      title: { zh: '企业官网', en: 'Corporate Website' },
      desc:  {
        zh: '单页式企业站，含响应式布局、滚动入场动效、作品展示、服务区块与联系表单。适合公司官网、工作室主页、产品介绍页。',
        en: 'Single-page corporate site with responsive layout, scroll-in animations, portfolio, services and a contact form. Suited to company sites and studio homepages.'
      },
      meta:  { zh: '单页 · 3–5 天交付', en: 'Single page · 3–5 days' },
      tags: ['HTML5', 'Bootstrap 5', 'Vanilla JS'],
      href: 'agency/index.html'
    },
    {
      img: 'covers/shop.jpg',
      cat:   { zh: '电商商城 · 商品与下单流程', en: 'E-commerce · Catalog and checkout' },
      title: { zh: '电商商城', en: 'E-commerce Store' },
      desc:  {
        zh: '分类导航、商品列表、详情页、购物车、结算与会员中心都已就位。九个页面完整跑通从浏览到下单的链路。',
        en: 'Category navigation, product listing, detail page, cart, checkout and account centre. Nine pages covering the whole path from browsing to order.'
      },
      meta:  { zh: '9 个页面 · 5–10 天交付', en: '9 pages · 5–10 days' },
      tags: ['Tailwind CSS', 'HTML5', 'Vanilla JS'],
      href: 'shop/index.html'
    },
    {
      img: 'covers/mobile.jpg',
      phone: true,
      cat:   { zh: '移动端 · 手机商城', en: 'Mobile · Storefront' },
      title: { zh: '移动端商城', en: 'Mobile Storefront' },
      desc:  {
        zh: '手机宽度下的商品浏览与购物流程，含轮播、分类、商品详情与购物车。适合小程序上线前的 H5 版本，或移动端导购页。',
        en: 'Product browsing and checkout at phone width, with carousel, categories, detail and cart. Suits an H5 build before a mini program ships.'
      },
      meta:  { zh: '3 个页面 · 3–5 天交付', en: '3 pages · 3–5 days' },
      tags: ['Bootstrap 4', 'Owl Carousel', 'Mobile'],
      href: 'mobile/index.html'
    },
    {
      img: 'covers/adminlte.jpg',
      cat:   { zh: '后台管理 · 完整版', en: 'Admin panel · Complete' },
      title: { zh: '后台管理系统 · 完整版', en: 'Admin System · Complete' },
      desc:  {
        zh: '多套皮肤、仪表盘、表单组件、邮箱、用户管理、日历与图表库。适合功能较重的业务系统，权限体系和报表可以在此之上继续搭建。',
        en: 'Multiple skins, dashboards, form components, mailbox, user management, calendar and chart libraries. Built for feature-heavy systems with room for permissions and reporting.'
      },
      meta:  { zh: '40+ 页面 · 7–15 天交付', en: '40+ pages · 7–15 days' },
      tags: ['Bootstrap 5', 'AdminLTE', 'Multi-skin'],
      href: 'adminlte/index.html'
    },
    {
      img: 'covers/sb-admin.jpg',
      cat:   { zh: '后台管理 · 基础版', en: 'Admin panel · Starter' },
      title: { zh: '后台管理系统 · 基础版', en: 'Admin System · Starter' },
      desc:  {
        zh: '登录、注册、数据表格、图表与 404 页均已就位。结构轻，改起来快，适合中小型系统的管理端，内部版本三天内能上线。',
        en: 'Login, registration, data tables, charts and a 404 page are all in place. Lightweight and quick to adapt — an internal build can go live within three days.'
      },
      meta:  { zh: '8 个页面 · 3–7 天交付', en: '8 pages · 3–7 days' },
      tags: ['Bootstrap 4', 'Chart.js', 'jQuery'],
      href: 'admin-sb/index.html'
    }
  ];

  var T = {
    zh: {
      brand: '项目案例', brandsub: '网站 / 小程序 / 后台',
      h1: '可交付的项目骨架',
      lead: '每个案例都可以直接点开操作，不是效果图。源码完整交付，交付范围和工期写在每一栏下面。',
      view: '查看演示 →',
      fstrong: '需要类似的项目？',
      ftext: ' 把功能清单发我，按模块拆解工期和报价。',
      fmail: '邮箱：',
      title: '项目案例 · 网站 / 小程序 / 后台系统'
    },
    en: {
      brand: 'Work', brandsub: 'Web / Mini Program / Admin',
      h1: 'Deliverable project skeletons',
      lead: 'Every case is live and clickable — not a mockup. Full source is delivered, and each entry states its scope and timeline.',
      view: 'View demo →',
      fstrong: 'Need something similar?',
      ftext: ' Send me your feature list and I will break it down into scope, timeline and price.',
      fmail: 'Email: ',
      title: 'Work · Websites / Mini Programs / Admin Systems'
    }
  };

  var cur = 'zh';

  function render(lang) {
    cur = T[lang] ? lang : 'zh';
    var t = T[cur];
    document.documentElement.lang = (cur === 'zh') ? 'zh-CN' : 'en';
    document.title = t.title;

    document.querySelectorAll('[data-i18n]').forEach(function (n) {
      var k = n.getAttribute('data-i18n');
      if (t[k] !== undefined) n.textContent = t[k];
    });

    document.getElementById('list').innerHTML = P.map(function (p) {
      var tags = p.tags.map(function (x) { return '<span class="tag">' + x + '</span>'; }).join('');
      return '<a class="item" href="' + p.href + '" target="_blank" rel="noopener">' +
        '<span class="thumb' + (p.phone ? ' phone' : '') + '"><img src="' + p.img + '" alt="" loading="lazy"></span>' +
        '<div class="meta">' + p.cat[cur] + '　·　' + p.meta[cur] + '</div>' +
        '<h3>' + p.title[cur] + '</h3>' +
        '<p class="desc">' + p.desc[cur] + '</p>' +
        '<div class="row"><div class="tags">' + tags + '</div>' +
        '<span class="view">' + t.view + '</span></div>' +
        '</a>';
    }).join('');

    document.querySelectorAll('.lang-switch button').forEach(function (b) {
      b.className = (b.getAttribute('data-lang') === cur) ? 'active' : '';
    });

    try { localStorage.setItem('demo_lang', cur); } catch (e) {}
  }

  document.querySelectorAll('.lang-switch button').forEach(function (b) {
    b.addEventListener('click', function () { render(this.getAttribute('data-lang')); });
  });

  var saved = 'zh';
  try { saved = localStorage.getItem('demo_lang') || 'zh'; } catch (e) {}
  render(saved);

  var addr = atob('a2F6YW15dXVqaTQ4NkBnbWFpbC5jb20=');
  var m = document.getElementById('mail');
  m.textContent = addr;
  m.href = 'mailto:' + addr;
})();
</script>

</body>
</html>
